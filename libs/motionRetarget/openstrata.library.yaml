# OpenStrata plain-library descriptor. motionRetarget expands a MotionPose onto
# a target skeleton given as plain values: the map, rest correction, root-motion
# policy and retarget diagnostics (docs/design/RETARGETING_POLICY.md).
schema: openstrata.library/v1alpha1
library:
  id: motionRetarget
  # Mirrors the repository-root VERSION (docs/architecture/WORKSPACE.md §4).
  version: 0.5.1
requires:
  libraries:
    - id: motionCore
      version: ">=0.5,<0.6"
cmake:
  package: motionRetarget
  target: motionRetarget::motionRetarget
