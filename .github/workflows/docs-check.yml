# Hand-written (not generated by `ost ci generate`).
#
# Documentation and source-boundary consistency: every relative link and heading anchor resolves,
# and every place that restates the product version or the OpenUSD pin
# agrees with the one that defines it (scripts/check_docs.py). Deliberately
# cheap -- no runtime, no `ost`, no OpenUSD. Connector source/manifest rules and
# compiler-free CMake graph fixtures run here; configured SDK closures run in
# the workspace CTest lanes.
name: docs-check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "VERSION"
      - "openstrata.ci.yaml"
      - "openstrata.toml"
      - "**/openstrata.plugin.yaml"
      - "**/openstrata.library.yaml"
      - "**/openstrata.tool.yaml"
      - "**/CMakeLists.txt"
      - "cmake/*.cmake"
      - "scripts/check_docs.py"
      - "scripts/*connector_boundaries.py"
      - "libs/**"
      - "tools/**"
      - "plugins/**"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "VERSION"
      - "openstrata.ci.yaml"
      - "openstrata.toml"
      - "**/openstrata.plugin.yaml"
      - "**/openstrata.library.yaml"
      - "**/openstrata.tool.yaml"
      - "**/CMakeLists.txt"
      - "cmake/*.cmake"
      - "scripts/check_docs.py"
      - "scripts/*connector_boundaries.py"
      - "libs/**"
      - "tools/**"
      - "plugins/**"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the checker's own rules
        run: python scripts/check_docs.py --selftest
      - name: Check links, anchors and mirrored versions
        run: python scripts/check_docs.py
      - name: Check connector boundary refusal fixtures
        run: python scripts/test_connector_boundaries.py
      - name: Check connector source and manifest boundaries
        run: python scripts/check_connector_boundaries.py
