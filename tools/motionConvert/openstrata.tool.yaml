# OpenStrata workspace-tool descriptor for motion_convert: a recorded source
# and a named profile become a motion stage (WORKSPACE.md §1.2).
#
# It requires motionUsd, which authors the stage, and motionSource **by name** rather than only through motionBvh: it
# matches a profile, converts, and reads a rest pose back, none of which
# motionBvh's headers expose. The descriptor states the edge the tool actually
# has, instead of leaving it to a transitive dependency that could stop being
# transitive.
schema: openstrata.tool/v1alpha1
tool:
  id: motion_convert
  # Mirrors the repository-root VERSION (docs/architecture/WORKSPACE.md §4).
  version: 0.1.0
  license: Apache-2.0
executables: [motion_convert]
directories: [bin]
requires:
  libraries:
    - id: motionBvh
      version: ">=0.1,<0.2"
    - id: motionSource
      version: ">=0.1,<0.2"
    - id: motionUsd
      version: ">=0.1,<0.2"
